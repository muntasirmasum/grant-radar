name: weekly-refresh

on:
  schedule:
    # Sunday 23:00 UTC = Sunday 19:00 ET (EDT) / 18:00 ET (EST)
    - cron: "0 23 * * 0"
  workflow_dispatch:
    inputs:
      week_ending:
        description: "Week-ending date (YYYY-MM-DD). Defaults to current Friday."
        required: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
      - name: Run weekly refresh
        run: |
          Rscript -e 'source("R/pipeline.R"); refresh_week(week_ending = Sys.getenv("WEEK_ENDING"))'
        env:
          WEEK_ENDING: ${{ github.event.inputs.week_ending }}
      - name: Commit refreshed data
        run: |
          git config user.name "grant-radar-bot"
          git config user.email "bot@grant-radar.local"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "chore(data): weekly refresh $(date -u +%Y-%m-%d)"
            git push
          else
            echo "No data changes."
          fi
