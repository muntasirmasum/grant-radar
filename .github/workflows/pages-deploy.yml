name: pages-deploy

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "data/notices.json"
      - ".github/workflows/pages-deploy.yml"
  workflow_dispatch:
  workflow_run:
    workflows: ["weekly-refresh"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage data files
        run: |
          if [ -f data/notices.json ]; then
            cp data/notices.json site/notices.json
          else
            echo '{"generated_at":null,"items":[]}' > site/notices.json
          fi
          if [ -f data/feed.xml ]; then
            cp data/feed.xml site/feed.xml
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/
      - id: deployment
        uses: actions/deploy-pages@v4
