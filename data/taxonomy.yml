# Controlled vocabularies for grant-radar.
# Edit cautiously: every notice tags against these lists.

institutes_and_centers:
  - { code: NIH,   name: "National Institutes of Health" }
  - { code: NCI,   name: "National Cancer Institute" }
  - { code: NEI,   name: "National Eye Institute" }
  - { code: NHLBI, name: "National Heart, Lung, and Blood Institute" }
  - { code: NHGRI, name: "National Human Genome Research Institute" }
  - { code: NIA,   name: "National Institute on Aging" }
  - { code: NIAAA, name: "National Institute on Alcohol Abuse and Alcoholism" }
  - { code: NIAID, name: "National Institute of Allergy and Infectious Diseases" }
  - { code: NIAMS, name: "National Institute of Arthritis and Musculoskeletal and Skin Diseases" }
  - { code: NIBIB, name: "National Institute of Biomedical Imaging and Bioengineering" }
  - { code: NICHD, name: "Eunice Kennedy Shriver National Institute of Child Health and Human Development" }
  - { code: NIDCD, name: "National Institute on Deafness and Other Communication Disorders" }
  - { code: NIDCR, name: "National Institute of Dental and Craniofacial Research" }
  - { code: NIDDK, name: "National Institute of Diabetes and Digestive and Kidney Diseases" }
  - { code: NIDA,  name: "National Institute on Drug Abuse" }
  - { code: NIEHS, name: "National Institute of Environmental Health Sciences" }
  - { code: NIGMS, name: "National Institute of General Medical Sciences" }
  - { code: NIMH,  name: "National Institute of Mental Health" }
  - { code: NIMHD, name: "National Institute on Minority Health and Health Disparities" }
  - { code: NINDS, name: "National Institute of Neurological Disorders and Stroke" }
  - { code: NINR,  name: "National Institute of Nursing Research" }
  - { code: NLM,   name: "National Library of Medicine" }
  - { code: NCATS, name: "National Center for Advancing Translational Sciences" }
  - { code: NCCIH, name: "National Center for Complementary and Integrative Health" }
  - { code: FIC,   name: "Fogarty International Center" }
  - { code: CSR,   name: "Center for Scientific Review" }
  - { code: OD,    name: "Office of the Director" }

mechanisms:
  - { code: R01, label: "Research Project Grant", career: any }
  - { code: R03, label: "Small Grant Program", career: any }
  - { code: R15, label: "Academic Research Enhancement Award", career: any }
  - { code: R21, label: "Exploratory/Developmental Research", career: any }
  - { code: R34, label: "Planning Grant", career: any }
  - { code: R36, label: "Dissertation Award", career: trainee }
  - { code: R44, label: "SBIR Phase II", career: any }
  - { code: K01, label: "Mentored Research Scientist Career Development", career: early_career }
  - { code: K08, label: "Mentored Clinical Scientist Career Development", career: early_career }
  - { code: K23, label: "Mentored Patient-Oriented Research Career Development", career: early_career }
  - { code: K99, label: "Pathway to Independence Award (Phase 1)", career: early_career }
  - { code: F30, label: "Predoctoral MD/PhD Fellowship", career: trainee }
  - { code: F31, label: "Predoctoral Fellowship", career: trainee }
  - { code: F32, label: "Postdoctoral Fellowship", career: trainee }
  - { code: T32, label: "Institutional Predoctoral Training Grant", career: trainee }
  - { code: U01, label: "Cooperative Agreement Research Project", career: any }
  - { code: U54, label: "Specialized Cooperative Centers", career: any }
  - { code: P01, label: "Research Program Project", career: any }
  - { code: P30, label: "Center Core Grant", career: any }

career_stages:
  - trainee
  - early_career
  - midcareer
  - established
  - any

# Topic clusters used by the LLM extractor to tag notices. Hand-curated; expand as
# the corpus grows. Each entry's `name` is the canonical tag string and
# `synonyms` are extraction hints for the LLM prompt.
topics:
  - name: aging
    synonyms: [aging, geriatric, dementia, alzheimer]
  - name: cancer
    synonyms: [cancer, oncology, tumor, neoplasm]
  - name: cardiovascular
    synonyms: [cardiovascular, heart disease, stroke]
  - name: mental_health
    synonyms: [mental health, depression, anxiety, psychiatric]
  - name: substance_use
    synonyms: [substance use, addiction, opioid, alcohol]
  - name: infectious_disease
    synonyms: [infectious disease, HIV, tuberculosis, vaccine]
  - name: maternal_child_health
    synonyms: [maternal, pediatric, child health, prenatal]
  - name: health_disparities
    synonyms: [health disparities, equity, structural racism, social determinants]
  - name: behavioral_intervention
    synonyms: [behavioral intervention, psychosocial, prevention]
  - name: methods_and_statistics
    synonyms: [methods, statistics, biostatistics, causal inference]
  - name: data_science_ai
    synonyms: [machine learning, artificial intelligence, deep learning, data science]
  - name: implementation_science
    synonyms: [implementation, dissemination, T4 research]
  - name: clinical_trials
    synonyms: [clinical trial, RCT, randomized]
  - name: epidemiology
    synonyms: [epidemiology, observational, cohort]
  - name: training_and_career
    synonyms: [training, career development, mentored]
  - name: infrastructure
    synonyms: [infrastructure, core facility, data resource, biobank]
